<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my-wallet · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(60% 50% at 50% 0%, oklch(0.2 0.01 88), transparent 70%),
      oklch(0.10 0.006 88);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-family: var(--font-sans);
  }
  #stage { position: relative; }
  #scaler { transform-origin: center center; }
  /* hide internal scrollbars for a clean device look */
  #scaler *::-webkit-scrollbar { width: 0; height: 0; }
  #scaler * { scrollbar-width: none; }
</style>
</head>
<body>
<script src="styles/icons.js"></script>
<div id="stage"><div id="scaler"><div id="root"></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/screens.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>

<script>
  function fit() {
    const sc = document.getElementById('scaler');
    const W = 402, H = 874;
    const s = Math.min((window.innerWidth - 24) / W, (window.innerHeight - 24) / H, 1.15);
    sc.style.transform = `scale(${s})`;
    sc.style.width = W + 'px';
    sc.style.height = H + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  // re-fit after fonts/react settle
  setTimeout(fit, 400);
</script>
</body>
</html>
