<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(70% 45% at 50% 0%, var(--bg-grad-top), transparent 65%),
      var(--bg);
    font-family: var(--font-sans); color: var(--text);
  }
  /* hide inner scrollbars inside frames + flow rows for a clean look */
  #root *::-webkit-scrollbar { height: 6px; width: 0; }
  #root *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

  .doc-header {
    position: sticky; top: 0; z-index: var(--z-sticky);
    background: color-mix(in oklch, var(--bg) 80%, transparent);
    backdrop-filter: blur(16px) saturate(1.3);
    border-bottom: 1px solid var(--border);
  }
  .doc-header__inner { max-width: 1180px; margin: 0 auto; padding: var(--space-4) var(--space-6); display: flex; align-items: center; gap: var(--space-4); }
  .doc-header__inner a { color: var(--text-muted); text-decoration: none; font-size: var(--text-sm); font-weight: 600; padding: 8px 12px; border-radius: var(--radius-sm); }
  .doc-header__inner a:hover { color: var(--text); background: var(--surface-2); }
</style>
